# Builds the students' codespace image once (RStudio Server + lab packages) and
# publishes it to ghcr.io/gdsl-ul/stats-rstudio, so new codespaces only have to
# download it. Free for a public repo with a public package.
name: Build codespace image

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/image/**"
      - ".devcontainer/packages.R"
      - ".github/workflows/devcontainer-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/image/devcontainer.json
          imageName: ghcr.io/gdsl-ul/stats-rstudio
          cacheFrom: ghcr.io/gdsl-ul/stats-rstudio
          skipContainerUserIdUpdate: true
          # Smoke test: RStudio is installed and every lab package loads.
          runCmd: |
            which rserver
            Rscript -e 'source(".devcontainer/packages.R"); invisible(lapply(packages, library, character.only = TRUE))'
          push: filter
          refFilterForPush: refs/heads/main
          # One event per line (a comma-separated list matches nothing).
          eventFilterForPush: |
            push
            workflow_dispatch
